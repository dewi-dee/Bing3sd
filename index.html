<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Food Fun! | Versi 7 November - Audio & Matching</title>
<style>
:root{--ink:#302b4a;--purple:#d8c8ff;--pink:#ffd8e9;--yellow:#fff0ac;--green:#c9f3d8;--blue:#ccecff}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Trebuchet MS",sans-serif;color:var(--ink);background:linear-gradient(135deg,#9bd8ff,#f9b9df 45%,#ffe48a 80%,#a7f1c3);min-height:100vh}

h1{font-size:clamp(2.1rem,6vw,3.7rem);margin:12px 0}h2{font-size:clamp(1.5rem,4vw,2.4rem)}p{font-size:1.12rem;line-height:1.55}.tag{display:inline-block;border-radius:99px;background:var(--purple);padding:9px 17px;font-weight:800}
button,input{font:inherit}button{border:2px solid #4b436a18;border-radius:17px;padding:13px 18px;background:var(--purple);color:var(--ink);font-weight:800;cursor:pointer;transition:transform .15s}button:hover{transform:translateY(-2px)}button:focus-visible,input:focus-visible{outline:3px solid #6d52c3;outline-offset:3px}button:disabled{opacity:.6;cursor:not-allowed}
.green{background:var(--green)}.pink{background:var(--pink)}.yellow{background:var(--yellow)}.blue{background:var(--blue)}
.center{text-align:center}.hero{font-size:clamp(4rem,11vw,7rem);margin:15px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px;margin:22px 0}.tile{border:2px solid #ffffff;box-shadow:0 5px 0 #463e6920;background:var(--blue);border-radius:20px;padding:18px;text-align:center}.tile:nth-child(3n+2){background:var(--pink)}.tile:nth-child(3n){background:var(--yellow)}.icon{font-size:3.5rem;display:block}.tile strong{display:block;margin:8px}

.feedback{padding:17px;background:var(--yellow);border-radius:20px;margin:15px 0;font-weight:700}.muted{font-size:.94rem;color:#625b75}.big{font-size:1.7rem;font-weight:900}.bar{height:13px;background:#eae5f6;border-radius:20px;overflow:hidden;margin:16px 0}.bar div{height:100%;background:#a78be9;transition:width .3s}input{padding:12px;border:2px solid #b7a4ed;border-radius:14px;max-width:100%}
.pair{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.pair button{min-width:125px}.selected{outline:4px solid #7660d7}.done{opacity:.55}.confetti{font-size:3rem;animation:bounce .6s infinite alternate}
@keyframes rise{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes bounce{to{transform:translateY(-10px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:22px auto;max-width:590px}.menu-card{min-height:105px;font-size:1.25rem;border:3px solid #ffffff;box-shadow:0 6px 0 #483b6d35}.start-button{display:block;width:100%;max-width:590px;margin:22px auto 0;background:linear-gradient(120deg,#42e48b,#17b9bd);color:#083b39;font-size:clamp(1.1rem,4vw,1.65rem);border:3px solid #128a73;box-shadow:0 7px 0 #126a61}button:active{transform:translateY(3px);box-shadow:none}.panel{background:linear-gradient(155deg,#fffefa,#fff7fd)}@media(max-width:420px){main{padding:9px}.panel{padding:16px;border-radius:22px}.menu-card{min-height:90px}}

.score-display{font-size:clamp(4.5rem,19vw,9rem);font-weight:1000;line-height:1.1;color:#6843c8;text-shadow:3px 5px 0 #ffe4a0;margin:18px 0;animation:scorePop .65s ease-out}
.score-total{font-size:clamp(1.3rem,5vw,2rem);font-weight:800}.result-card{background:linear-gradient(135deg,#fff0b0,#ffd4ec 55%,#c7f5e2);padding:24px;border-radius:28px;border:3px solid #fff;box-shadow:0 8px 22px #6c4d8822}
@keyframes scorePop{0%{transform:scale(.55);opacity:0}75%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

.match-board{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(34px,10vw,115px);padding:12px 0 18px;margin:18px 0}.match-column{display:flex;flex-direction:column;gap:18px;min-width:0;position:relative;z-index:2}.match-column h2{text-align:center;font-size:1.1rem;margin:0 0 5px}.match-choice{width:100%;min-height:82px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;background:#e4eaff;border:3px solid #b8a6ef;box-shadow:0 4px 0 #675b9825;position:relative}.match-picture{font-size:2.7rem;background:#fff0b8}.match-word{font-size:clamp(1rem,3.8vw,1.35rem);background:#d9edff}.match-choice.match-active{border-color:#6c48d9;background:#e8dcff;outline:3px solid #a48af1}.match-choice.match-correct{background:#c6f6d1;border-color:#19a65b;color:#135c32;opacity:1}.match-choice.match-error{background:#ffd0d0;border-color:#e24b4b}.match-choice:disabled{opacity:1;cursor:default}.match-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:visible}.match-lines line{stroke-linecap:round;stroke-width:7;filter:drop-shadow(0 2px 1px #ffffff)}.match-lines .line-good{stroke:#1caf5c}.match-lines .line-bad{stroke:#eb4444;stroke-dasharray:11 7}.match-hint{text-align:center;font-weight:700;color:#554b77}.match-feedback{min-height:60px}
@media(max-width:420px){.match-board{gap:38px}.match-choice{min-height:76px;padding:9px 4px}.match-picture{font-size:2.3rem}}

/* Feedback animations and celebration */
.feedback-pop{animation:popIn .36s ease both}.answers button.good,.match-correct{animation:successPulse .45s ease}.answers button.bad,.match-error{animation:shake .36s ease}.score-display{animation:scoreReveal .85s cubic-bezier(.2,1.5,.4,1) both}.celebration{font-size:2.5rem;letter-spacing:.25rem;animation:floatUp 1.4s ease-in-out infinite alternate}.sound-toggle{position:fixed;right:12px;bottom:12px;z-index:50;background:#fff;border:2px solid #7d60c7;box-shadow:0 3px 14px #0002;padding:10px 13px;font-size:.9rem}.match-lines line{transition:stroke-dashoffset .35s}.match-lines .line-good{stroke-dasharray:1000;stroke-dashoffset:0;animation:drawLine .55s ease-out}.match-complete{background:#c9f3d8;border:2px solid #1caf5c;border-radius:18px;padding:15px;text-align:center;font-weight:900;font-size:1.25rem;animation:popIn .4s ease}
@keyframes popIn{from{opacity:.5;transform:scale(.88)}to{opacity:1;transform:scale(1)}}@keyframes successPulse{50%{transform:scale(1.035)}}@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}@keyframes scoreReveal{from{opacity:0;transform:scale(.4) rotate(-8deg)}to{opacity:1;transform:scale(1) rotate(0)}}@keyframes floatUp{to{transform:translateY(-10px)}}@keyframes drawLine{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.feedback-pop,.answers button.good,.answers button.bad,.match-correct,.match-error,.score-display,.celebration,.match-lines .line-good{animation:none!important}}
</style></head><body><main><section class="panel" id="screen" aria-live="polite"></section></main><button id="soundToggle" class="sound-toggle" onclick="toggleSound()" aria-pressed="true">🔊 Suara ON</button><script>
"use strict";
const items=[["🍎","apple"],["🍌","banana"],["🍞","bread"],["🍚","rice"],["🍗","chicken"],["🍦","ice cream"],["💧","water"],["🥛","milk"],["🧃","juice"],["🍵","tea"],["☕","coffee"]];
const qs=[
{kind:"listen",audio:"I like apples.",prompt:"Listen. Which food do I like?",opts:["🍌 Bananas","🍎 Apples","🍞 Bread"],correct:1,explain:"I like apples artinya saya suka apel."},
{kind:"listen",audio:"I don't like milk.",prompt:"Listen. Which drink don't I like?",opts:["🥛 Milk","🧃 Juice","💧 Water"],correct:0,explain:"I don't like milk artinya saya tidak suka susu."},
{kind:"choice",prompt:"Pilih kalimat untuk 👍 🍌",opts:["I don't like bananas.","I like bananas.","I like tea."],correct:1,explain:"I like = saya suka."},
{kind:"choice",prompt:"Pilih kalimat untuk 👎 ☕",opts:["I like coffee.","I like milk.","I don't like coffee."],correct:2,explain:"I don't like = saya tidak suka."},
{kind:"tf",prompt:"'I like water' artinya 'Saya suka air putih'.",opts:["✅ True","❌ False"],correct:0,explain:"Benar. I like = saya suka."},
{kind:"tf",prompt:"'I don't like tea' artinya 'Saya suka teh'.",opts:["✅ True","❌ False"],correct:1,explain:"Salah. I don't like tea = saya tidak suka teh."},
{kind:"tf",prompt:"'I like ice cream' menyatakan kesukaan.",opts:["✅ True","❌ False"],correct:0,explain:"Benar. I like menyatakan kesukaan."},
{kind:"match",prompt:"Match! 🍗 = ...",opts:["Juice","Chicken","Bread"],correct:1,explain:"Chicken artinya ayam."},
{kind:"match",prompt:"Match! 🧃 = ...",opts:["Juice","Tea","Milk"],correct:0,explain:"Juice artinya jus."},
{kind:"listen",audio:"I don't like bananas.",prompt:"Listen. Which sentence did you hear?",opts:["I like bananas.","I don't like apples.","I don't like bananas."],correct:2,explain:"I don't like bananas = saya tidak suka pisang."}
];
let page=0,name="",qIndex=0,score=0,attempts=0,locked=false,chosen=-1,said=false,reflection="",speechStatus="",matchPicked=-1,matchSolved=[],matchStep=0,matchError=null,matchTimer=null;
const el=document.getElementById("screen");const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const button=(label,fn,cl="")=>`<button class="${cl}" onclick="${escapeHtml(fn)}">${label}</button>`;
function tts(t){if(!soundEnabled)return;if(!("speechSynthesis" in window)){alert("Perangkat ini tidak mendukung suara otomatis.");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.76;u.pitch=1.08;speechSynthesis.speak(u)}
function navigate(n){page=n;render()}function info(n){page=n;render()}function home(){navigate(0)}
function nav(prev,next,label="Next ➜"){return `<div class="actions">${button("⬅ Back",prev,"pink")}${button("🏠 Home","home()","yellow")}${button(label,next,"green")}</div>`}
function speech(text){said=true;document.getElementById("speakingText").textContent=text;tts(text);document.getElementById("nextSpeaking").disabled=false}
function microphone(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){speechStatus="🎤 Pengenalan suara belum didukung browser ini. Tetap ucapkan kalimatmu dan minta guru/teman menyimak.";render();return}
const target=document.getElementById("speakingText").textContent;if(target.includes("...")){speechStatus="Pilih kalimat terlebih dahulu.";render();return}
let r=new SR();r.lang="en-US";r.interimResults=false;r.maxAlternatives=1;r.onresult=e=>{const heard=e.results[0][0].transcript;const normalize=s=>s.toLowerCase().replace(/[^\w\s]/g,"").trim();speechStatus=normalize(heard)===normalize(target)?`🌟 Excellent! I heard: "${heard}"`:`💪 I heard: "${heard}". Coba ulangi: "${target}"`;render()};r.onerror=e=>{speechStatus="Mikrofon tidak tersedia atau izin ditolak. Kamu tetap bisa latihan bersama guru.";render()};try{r.start()}catch(e){speechStatus="Mikrofon tidak bisa dimulai.";render()}}
// Suara efek dibuat langsung di browser, tanpa file audio eksternal.
let audioCtx=null,soundEnabled=true;
function toggleSound(){soundEnabled=!soundEnabled;const b=document.getElementById("soundToggle");if(b){b.textContent=soundEnabled?"🔊 Suara ON":"🔇 Suara OFF";b.setAttribute("aria-pressed",String(soundEnabled))}if(!soundEnabled&&"speechSynthesis" in window)speechSynthesis.cancel();else if(soundEnabled)soundCorrect()}
function praise(text){if(!soundEnabled||!("speechSynthesis" in window))return;setTimeout(()=>{if(!soundEnabled)return;const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.9;u.pitch=1.17;speechSynthesis.cancel();speechSynthesis.speak(u)},360)}

function playNotes(notes,kind="sine"){
 if(!soundEnabled)return;try{
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  if(!audioCtx)audioCtx=new AC();if(audioCtx.state==="suspended")audioCtx.resume();
  let at=audioCtx.currentTime+.015;
  for(const [freq,duration] of notes){
   const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
   osc.type=kind;osc.frequency.setValueAtTime(freq,at);
   gain.gain.setValueAtTime(.0001,at);
   gain.gain.exponentialRampToValueAtTime(.13,at+.012);
   gain.gain.exponentialRampToValueAtTime(.0001,at+duration);
   osc.connect(gain);gain.connect(audioCtx.destination);osc.start(at);osc.stop(at+duration+.01);
   at+=duration*.87;
  }
 }catch(e){/* Game tetap berjalan jika audio tidak didukung. */}
}
function soundCorrect(){playNotes([[523,.13],[659,.13],[784,.23]],"sine")}
function soundWrong(){playNotes([[330,.17],[247,.24]],"triangle")}
function soundResult(){playNotes([[392,.14],[523,.14],[659,.14],[784,.17],[1047,.38],[784,.13],[1047,.45]],"sine");praise(score>=8?"Amazing! Great job!": "Well done! Keep practicing!")}
function startQuiz(){page=5;qIndex=0;score=0;attempts=0;locked=false;chosen=-1;render()}
function pick(i){if(locked)return;chosen=i;attempts++;const q=qs[qIndex];if(i===q.correct){score++;locked=true;soundCorrect();praise(["Excellent!","Great job!","Wonderful!","Correct!"][qIndex%4])}else{locked=false;soundWrong();praise("Try again!")}render()}
function nextQ(){qIndex++;chosen=-1;locked=false;if(qIndex>=qs.length){page=6;soundResult()}render()}
function resetMatch(){if(matchTimer)clearTimeout(matchTimer);matchTimer=null;matchPicked=-1;matchSolved=[];matchError=null;speechStatus="";render()}
function choosePicture(i){if(matchSolved.includes(i))return;if(matchTimer)clearTimeout(matchTimer);matchError=null;matchPicked=i;speechStatus="Sekarang pilih kata yang sesuai di kanan!";render()}
function chooseWord(i){if(matchSolved.includes([2,0,1].indexOf(i)))return;if(matchPicked<0){speechStatus="Pilih gambar di kiri dahulu!";render();return}const pic=matchPicked;if(i===[2,0,1][pic]){matchSolved.push(pic);matchPicked=-1;matchError=null;speechStatus=matchSolved.length===3?"🎉 Excellent! Semua pasangan benar!":"✅ Correct! Garis hijau menunjukkan jawaban benar.";soundCorrect();render();setTimeout(()=>{if(page===45)tts(["Apple","Milk","Banana"][pic])},700);if(matchSolved.length===3){setTimeout(()=>{if(page===45){soundResult();render()}},1600)}}else{matchError={picture:pic,word:i};matchPicked=-1;speechStatus="❌ Try again! Garis merah menunjukkan jawaban salah.";soundWrong();praise("Try again!");render();if(matchTimer)clearTimeout(matchTimer);matchTimer=setTimeout(()=>{matchError=null;matchTimer=null;if(page===45)render()},1100)}}
function drawMatchLines(){const board=document.getElementById("matchBoard"),svg=document.getElementById("matchLines");if(!board||!svg)return;const bounds=board.getBoundingClientRect();svg.setAttribute("viewBox",`0 0 ${bounds.width} ${bounds.height}`);svg.innerHTML="";function line(pic,word,good){const a=board.querySelector(`[data-pic="${pic}"]`),b=board.querySelector(`[data-word="${word}"]`);if(!a||!b)return;const ar=a.getBoundingClientRect(),br=b.getBoundingClientRect(),x1=ar.right-bounds.left,y1=ar.top+ar.height/2-bounds.top,x2=br.left-bounds.left,y2=br.top+br.height/2-bounds.top;const l=document.createElementNS("http://www.w3.org/2000/svg","line");for(const [k,v] of Object.entries({x1,y1,x2,y2}))l.setAttribute(k,v);l.setAttribute("class",good?"line-good":"line-bad");svg.appendChild(l)}matchSolved.forEach(i=>line(i,[2,0,1][i],true));if(matchError)line(matchError.picture,matchError.word,false)}
function render(){
let h="";
if(page===0)h=`<div class="center"><p style="font-size:.85rem;font-weight:800;color:#5c459a">✨ VERSI BARU • AUDIO & MATCHING V2 • 07 NOV 2026</p><span class="tag">🎧 Listening & Speaking • Bahasa Inggris Kelas 3 SD</span><div class="hero">🍎 🥛 🍌</div><h1>FOOD FUN!</h1><h2>I Like It! 💖 I Don't Like It! 🙅</h2><p>Let's listen, speak, and play!</p><p>Nama murid: <input id="studentName" aria-label="Nama murid" value="${escapeHtml(name)}" placeholder="Tulis namamu"></p><h2>🌈 Explore & Learn</h2><div class="menu-grid"><button class="menu-card blue" onclick="name=document.getElementById('studentName').value.trim();info(1)">🎯<br>Tujuan</button><button class="menu-card yellow" onclick="name=document.getElementById('studentName').value.trim();info(9)">🎮<br>Panduan</button><button class="menu-card pink" onclick="name=document.getElementById('studentName').value.trim();info(10)">📚<br>Materi Inti</button><button class="menu-card green" onclick="name=document.getElementById('studentName').value.trim();info(11)">📝<br>Evaluasi</button></div>${button("▶ MULAI PETUALANGAN!","name=document.getElementById('studentName').value.trim();navigate(1)","start-button")}</div>`;
if(page===9)h=`<span class="tag">🎮 Panduan Bermain</span><h1>How to Play? 🚀</h1><div class="cards"><div class="tile"><span class="icon">👆</span><strong>1. Pilih & Sentuh</strong>Ketuk gambar makanan atau minuman untuk mendengar kosakatanya.</div><div class="tile"><span class="icon">🔊</span><strong>2. Listen</strong>Dengarkan contoh pengucapan bahasa Inggris.</div><div class="tile"><span class="icon">🎤</span><strong>3. Speak</strong>Pilih 👍 atau 👎 lalu ucapkan kalimat I like / I don't like.</div><div class="tile"><span class="icon">🧩</span><strong>4. Match</strong>Cocokkan gambar dengan kata yang tepat.</div><div class="tile"><span class="icon">🏆</span><strong>5. Quiz</strong>Jawab 10 soal dan lihat skor belajarmu.</div><div class="tile"><span class="icon">💭</span><strong>6. Reflect</strong>Ceritakan apa yang sudah kamu pelajari.</div></div><p class="feedback">💡 Suara otomatis menggunakan fitur perangkat. Untuk cek mikrofon, gunakan browser yang mendukung dan izinkan akses mikrofon.</p>${nav("home()","navigate(2)","📚 Learn Vocabulary ➜")}`;
if(page===10)h=`<span class="tag">📚 Materi Inti</span><h1>Food and Drinks 🍓🥤</h1><p>Belajar nama makanan dan minuman, lalu ceritakan yang kamu suka dan tidak suka!</p><div class="cards"><button class="tile" onclick="navigate(2)"><span class="icon">🍎🍞</span><strong>Vocabulary</strong>Ketuk gambar dan dengarkan kata.</button><button class="tile" onclick="navigate(3)"><span class="icon">👍👎</span><strong>Like & Dislike</strong>I like... / I don't like...</button><button class="tile" onclick="navigate(4)"><span class="icon">🎤</span><strong>Speaking Practice</strong>Ucapkan kalimatmu sendiri.</button></div><div class="feedback"><b>Sentence patterns:</b><br>👍 I like apples. = Saya suka apel.<br>👎 I don't like milk. = Saya tidak suka susu.<br>❓ Do you like bananas? = Apakah kamu suka pisang?<br>✅ Yes, I do. / ❌ No, I don't.</div>${nav("home()","navigate(2)","🔊 Explore Words ➜")}`;
if(page===11)h=`<span class="tag">📝 Evaluasi</span><h1>Show What You Know! 🌟</h1><p>Siap menguji kemampuanmu?</p><div class="cards"><div class="tile"><span class="icon">🎧</span><strong>Listening</strong>Dengarkan lalu pilih jawaban.</div><div class="tile"><span class="icon">🍌</span><strong>Vocabulary</strong>Kenali makanan dan minuman.</div><div class="tile"><span class="icon">👍👎</span><strong>Like & Dislike</strong>Pilih kalimat yang sesuai.</div><div class="tile"><span class="icon">🏆</span><strong>10 Questions</strong>Setiap jawaban benar mendapat 1 poin.</div></div><div class="center">${button("🚀 MULAI EVALUASI","startQuiz()","start-button")}</div>${nav("home()","navigate(10)","📚 Review Material ➜")}`;
if(page===1)h=`<span class="tag">🎯 Learning Objectives</span><h1>Today I Can...</h1><div class="cards"><div class="tile"><span class="icon">🍎</span>Mengidentifikasi kosakata makanan dan minuman</div><div class="tile"><span class="icon">🎧</span>Memahami ungkapan suka dan tidak suka</div><div class="tile"><span class="icon">🎤</span>Mengungkapkan rasa suka (<b>like</b>) dan tidak suka (<b>dislike</b>) terhadap makanan atau minuman tertentu</div></div>${nav("home()","navigate(9)","🎮 Panduan ➜")}`;
if(page===2)h=`<span class="tag">📚 Vocabulary</span><h1>Food & Drinks</h1><p>Tap each picture and listen! 🔊</p><div class="cards">${items.map(([emoji,word])=>`<button class="tile" onclick="tts('${word}')"><span class="icon">${emoji}</span><strong>${word}</strong>🔊 Listen</button>`).join("")}</div>${nav("navigate(1)","navigate(3)")}`;
if(page===3)h=`<span class="tag">💬 Learn the Sentences</span><h1>Let's Say It!</h1><div class="cards"><div class="tile"><span class="icon">👍 🍎</span><p class="big">I like apples.</p><p>Saya suka apel.</p>${button("🔊 Listen","tts('I like apples.')","green")}</div><div class="tile"><span class="icon">👎 ☕</span><p class="big">I don't like coffee.</p><p>Saya tidak suka kopi.</p>${button("🔊 Listen",`tts(${JSON.stringify("I don't like coffee.")})`,"green")}</div></div><p>💡 <b>I like...</b> = Saya suka...<br>💡 <b>I don't like...</b> = Saya tidak suka...</p>${nav("navigate(2)","navigate(4)")}`;
if(page===4)h=`<span class="tag">🎤 Speaking Challenge</span><h1>Speak Up!</h1><p>Pilih gambar, tekan 👍 atau 👎, dengarkan, lalu ucapkan dengan suara keras.</p><div class="cards">${items.slice(0,8).map(([e,w])=>`<div class="tile"><span class="icon">${e}</span><strong>${w}</strong><div class="pair">${button("👍 Like",`speech('I like ${w}.')`,"green")}${button("👎 Don't like",`speech(${JSON.stringify("I don't like "+w+".")})`,"pink")}</div></div>`).join("")}</div><div class="center"><p id="speakingText" class="big">${escapeHtml(window.lastSpeaking||"I like... / I don't like...")}</p>${button("🎙️ Check My Speaking","microphone()","blue")}<p class="muted">Pengenalan suara opsional: biasanya memerlukan HTTPS, izin mikrofon, dan browser yang mendukung. Jika tidak tersedia, guru/teman menyimak.</p><div class="feedback">${escapeHtml(speechStatus||"Listen • Repeat • Speak!")}</div></div><div class="actions">${button("⬅ Back","navigate(3)","pink")}${button("🏠 Home","home()","yellow")}<button id="nextSpeaking" class="green" onclick="navigate(45)" ${said?"":"disabled"}>🎲 Matching Game ➜</button></div>`;
if(page===45){const pics=["🍎","🥛","🍌"],words=["milk","banana","apple"],solvedWords=matchSolved.map(i=>[2,0,1][i]);h=`<span class="tag">🧩 Matching Game</span><h1>🔗 Connect the Pairs!</h1><p>1. Ketuk gambar di kiri. 2. Ketuk kata di kanan. Garis <b style="color:#15803d">hijau = benar ✓</b>, <b style="color:#dc2626">merah = salah ✗</b>.</p><div id="matchBoard" class="match-board"><svg id="matchLines" class="match-lines" aria-hidden="true"></svg><div class="match-column"><h2>🖼️ Pictures</h2>${pics.map((e,i)=>`<button type="button" data-pic="${i}" class="match-choice match-picture ${matchPicked===i?"match-active":""} ${matchSolved.includes(i)?"match-correct":""} ${matchError&&matchError.picture===i?"match-error":""}" onclick="choosePicture(${i})" ${matchSolved.includes(i)?"disabled":""}>${e}${matchSolved.includes(i)?'<small>✓ Correct</small>':''}</button>`).join("")}</div><div class="match-column"><h2>🔤 Words</h2>${words.map((w,i)=>`<button type="button" data-word="${i}" class="match-choice match-word ${solvedWords.includes(i)?"match-correct":""} ${matchError&&matchError.word===i?"match-error":""}" onclick="chooseWord(${i})" ${solvedWords.includes(i)?"disabled":""}>${w}${solvedWords.includes(i)?' ✓':''}</button>`).join("")}</div></div><div class="feedback feedback-pop" aria-live="polite">${escapeHtml(speechStatus||"Pilih gambar terlebih dahulu!")}</div>${matchSolved.length===3?`<div class="match-complete">🎉 🌟 Fantastic! All pairs matched! 🌟 🎉</div>`:""}<p><b>Pasangan benar: ${matchSolved.length}/3</b></p><div class="actions">${button("⬅ Back","navigate(4)","pink")}${button("🔄 Reset","resetMatch()","yellow")}${button("🧩 Start Quiz ➜","startQuiz()","green")}</div>`;}
if(page===5){let q=qs[qIndex],wrong=chosen>=0&&chosen!==q.correct;h=`<span class="tag">🧩 Quiz ${qIndex+1}/10 • ${q.kind.toUpperCase()}</span><div class="bar"><div style="width:${(qIndex+1)*10}%"></div></div><h2>${q.prompt}</h2>${q.audio?`<p>${button("🔊 PLAY AUDIO","tts(qs[qIndex].audio)","yellow")} <span class="muted">Dengarkan kalimatnya.</span></p>`:""}<div class="answers">${q.opts.map((o,i)=>`<button class="${locked&&i===q.correct?"good":wrong&&i===chosen?"bad":""}" onclick="pick(${i})" ${locked?"disabled":""}>${String.fromCharCode(65+i)}. ${o}</button>`).join("")}</div>${chosen>=0?`<div class="feedback feedback-pop">${locked?"🌟 Excellent! Well done!":"💪 Good try! "+q.explain+" Pilih lagi, ya!"}${locked?`<p class="muted">${q.explain}</p>`:""}</div>`:"<p class='muted'>Pilih jawaban yang paling tepat.</p>"}${locked?`<div class="actions">${button(qIndex===9?"🏆 See My Result":"Next Question ➜","nextQ()","green")}</div>`:""}`;}
if(page===6)h=`<div class="center"><span class="tag">🏆 Quiz Result</span><div class="hero">${score>=8?"🏆":"🌈"}</div><div class="celebration" aria-hidden="true">🎊 ✨ 🎉 ⭐ 🎊</div><h1>Great Job${name?", "+escapeHtml(name):""}!</h1><div class="result-card"><p class="score-total">NILAI AKHIR / FINAL SCORE</p><div class="score-display" aria-label="Nilai ${score*10} dari 100">${score*10}</div><p class="score-total">${score} dari ${qs.length} jawaban benar</p><p>${score>=8?"🌟 Amazing! You did it!":score>=5?"👏 Good effort! Keep practicing!":"💪 Keep trying! You can do it!"}</p>${button("🔊 Putar Suara Hasil","soundResult()","blue")}</div><div class="actions">${button("🏠 Ke Beranda","home()","green")}${button("🔁 Ulangi Kuis","startQuiz()","yellow")}${button("💭 Refleksi","navigate(7)","pink")}</div></div>`;
if(page===7)h=`<span class="tag">💭 Reflection</span><h1>How Do You Feel?</h1><div class="cards">${[["😊","I understand!"],["😐","I need more practice."],["🙋","I need help."]].map(([e,w])=>`<button class="tile" onclick="reflection=${JSON.stringify(w)};render()"><span class="icon">${e}</span>${w}</button>`).join("")}</div><div class="feedback">${reflection?"Thank you! "+escapeHtml(reflection):"Choose your feeling!"}</div><h2>Say it one more time!</h2><p class="big">I like ______.<br>I don't like ______.</p>${nav("navigate(6)","navigate(8)")}`;
if(page===8)h=`<div class="center"><span class="tag">🎉 Finished!</span><div class="hero">🌟 🎈 🍓</div><h1>YOU DID IT!</h1><p class="big">Keep Learning English and Have Fun!</p><p>Hebat! Kamu sudah mendengar, berbicara, dan berlatih.</p>${button("🏠 Play Again","said=false;speechStatus='';reflection='';home()","green")}</div>`;
el.innerHTML=h;
if(page===45)requestAnimationFrame(drawMatchLines);
if(page===4){const st=document.getElementById("speakingText");if(st&&window.lastSpeaking)st.textContent=window.lastSpeaking;}
}
const originalSpeech=speech;speech=function(t){window.lastSpeaking=t;originalSpeech(t)};
render();
</script></body></html>
